<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="real_calculator.css">
</head>
<body>
    <div id="calculator">
        <input id="display" readonly>
        <div id="keys">
            <button onclick="addendToDisplay('+')" class="operator_btn">+</button>
            <button onclick="addendToDisplay('7')">7</button>
            <button onclick="addendToDisplay('8')">8</button>
            <button onclick="addendToDisplay('9')">9</button>
            <button onclick="addendToDisplay('-')" class="operator_btn">-</button>
            <button onclick="addendToDisplay('4')">4</button>
            <button onclick="addendToDisplay('5')">5</button>
            <button onclick="addendToDisplay('6')">6</button>
            <button onclick="addendToDisplay('*')" class="operator_btn">*</button>
            <button onclick="addendToDisplay('1')">1</button>
            <button onclick="addendToDisplay('2')">2</button>
            <button onclick="addendToDisplay('3')">3</button>
            <button onclick="addendToDisplay('/')" class="operator_btn">/</button>
            <button onclick="addendToDisplay('0')">0</button>
            <button onclick="addendToDisplay('.')">.</button>
            <button onclick="calculate('=')" class="operator_btn">=</button>
            <button onclick="clearDisplay()" class="operator_btn">C</button>


        </div>
    </div>
    

    <script src="real_calculator.js"> </script>
</body>
</html>
